name: Bend 790 expanded validation
on:
  push:
    branches: [validation/bend-790-20260918]
    paths: [.github/workflows/bend-790-expanded.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUN_JSC_maxPerThreadStackUsage: '33554432'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: bendlang/bend
          ref: e6676b080f25b1bc1bf5b5b7d7a17e22f8022599
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.3
      - name: Repeat red-green regression and run existing controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          { git rev-parse HEAD; bun --version; node --version; clang --version; } | tee evidence/environment.txt
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          from urllib.request import urlopen
          url = 'https://raw.githubusercontent.com/sankalpsthakur/cpython/46fb1f6b4c7ad6883e79bc8c564fc89f3a206578/.github/workflows/bend-790-validation.yml'
          text = urlopen(url, timeout=30).read().decode()
          marker = "          cat > /tmp/validate-bend.py <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index('\n          PY', start)
          script = textwrap.dedent(text[start:end])
          old = r'(?:Nat|U32|F32|Bool|String|Unit):'
          new = r'(?:IO\(Unit\)|Nat|U32|F32|Bool|String|Unit):'
          assert script.count(old) == 1
          script = script.replace(old, new)
          old = "and 'IO(' not in text and '!(' not in text and '@unsafe' not in text"
          new = "and '!(' not in text and '@unsafe' not in text and not re.search(r'\\b(?:File|TCP|UDP|Window|Audio|Chan)\\.', text)"
          assert script.count(old) == 1
          script = script.replace(old, new)
          script = script.replace('Existing pure programs only', 'Existing non-hardware programs')
          script = script.replace('existing pure programs', 'existing selected programs')
          Path('/tmp/validate-bend.py').write_text(script)
          compile(script, '/tmp/validate-bend.py', 'exec')
          Path('evidence/validation.py').write_text(script)
          PY
          python3 /tmp/validate-bend.py | tee evidence/summary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bend-790-expanded-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 14
