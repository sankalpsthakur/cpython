name: Wave 2 configparser 96239 validation
on:
  push:
    branches: [validation/wave2-gh-96239-20260918]
    paths: [.github/workflows/wave2-96239.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_SHA: e2ff498cc03886b73fca0429ee745b04646ad8e0
      FIX_BRANCH: fix/gh-96239-write-whitespace-keys
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sankalpsthakur/cpython
          ref: e2ff498cc03886b73fca0429ee745b04646ad8e0
          persist-credentials: true
      - name: Execute the pinned validation with the corrected negative gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          import textwrap
          from urllib.request import urlopen

          url = ('https://raw.githubusercontent.com/sankalpsthakur/cpython/'
                 '7d87e11cc3dc5058cdf1154c1740ffa62b97df85/'
                 '.github/workflows/wave2-96239.yml')
          source = urlopen(url, timeout=30).read().decode('utf-8')
          scripts = re.findall(r'^        run: \|\n((?:          .*\n|\n)*)',
                               source, re.MULTILINE)
          assert len(scripts) == 6, len(scripts)
          scripts = [textwrap.dedent(s) for s in scripts]
          old = './python -m test -v -m test_write_rejects_whitespace_keys test_configparser'
          new = ('./python -m unittest -v test.test_configparser.'
                 'WriteWhitespaceKeysTestCase.test_write_rejects_whitespace_keys')
          assert scripts[2].count(old) == 1
          scripts[2] = scripts[2].replace(old, new)
          evidence = Path(os.environ['RUNNER_TEMP'], 'evidence')
          evidence.mkdir(exist_ok=True)
          (evidence / 'validation-source.yml').write_text(source)
          for number, script in enumerate(scripts, 1):
              print(f'::group::Validation stage {number}', flush=True)
              (evidence / f'stage-{number}.sh').write_text(script)
              subprocess.run(['bash', '-euo', 'pipefail', '-c', script], check=True)
              print('::endgroup::', flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wave2-96239-evidence
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 14
