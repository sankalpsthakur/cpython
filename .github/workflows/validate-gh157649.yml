name: Validate gh-157649 C++ refcounts
on:
  push:
    branches: [validation/gh157649-cpp-refcounts-20260918]
permissions:
  contents: read
jobs:
  regression:
    if: github.repository == 'sankalpsthakur/cpython'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Prepare exact upstream baseline and regression
        run: |
          cp .github/scripts/validate-gh157649.py "$RUNNER_TEMP/prepare.py"
          git checkout --detach 854295809ad5a42c9461f34d47b1252a3b4a2027
          test "$(git rev-parse HEAD)" = 854295809ad5a42c9461f34d47b1252a3b4a2027
          python3 "$RUNNER_TEMP/prepare.py" tests
          mkdir -p "$RUNNER_TEMP/evidence"
      - name: Build debug CPython
        run: |
          ./configure --with-pydebug > "$RUNNER_TEMP/evidence/configure.log" 2>&1
          make -j2 > "$RUNNER_TEMP/evidence/build.log" 2>&1
          ./python -VV
      - name: Require the new regression to fail before the fix
        shell: bash
        run: |
          set +e
          ./python -m test -u cpu -v -m test_build_cpp11 test_cppext > "$RUNNER_TEMP/evidence/before.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/evidence/before.log"
          test "$result" -ne 0
          grep -F 'Py_REFCNT(old_obj) == 1' "$RUNNER_TEMP/evidence/before.log"
          grep -F 'failed' "$RUNNER_TEMP/evidence/before.log"
      - name: Apply the minimal C++ compatibility fix
        run: |
          python3 "$RUNNER_TEMP/prepare.py" fix
          git diff --check
      - name: Run C and C++ extension suites with the fixed headers
        shell: bash
        run: |
          set -o pipefail
          ./python -m test -u cpu -v test_cppext test_cext 2>&1 | tee "$RUNNER_TEMP/evidence/after.log"
      - name: Publish only the tested fix to a new branch
        run: |
          git add Include/pyport.h Lib/test/test_cppext/extension.cpp 'Misc/NEWS.d/next/C API/2026-09-18-00-00-00.gh-issue-157649.CppRef.rst'
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git diff --cached --check
          git diff --cached --binary > "$RUNNER_TEMP/evidence/fix.patch"
          git -c user.name='Sankalp Thakur' -c user.email='sankalphimself@gmail.com' commit -m 'gh-157649: Restore safe C++ refcount macro temporaries' -m 'Use the existing memcpy fallback for C++ and test array items, references, single evaluation and concrete object pointers.' -m 'AI assistance: ChatGPT assisted with implementation and validation. The regression and fallback approach follow the issue discussion.'
          git rev-parse HEAD | tee "$RUNNER_TEMP/evidence/commit.txt"
          git push origin HEAD:refs/heads/fix/gh157649-cpp-refcount-lvalues
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gh157649-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 14
